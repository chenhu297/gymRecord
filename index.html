<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>💪 GymRecord</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="swipe-wrapper">
    <div id="swipe-track">
      <div id="page-gym" class="swipe-page">
        <div id="app"></div>
      </div>
      <div id="page-measure" class="swipe-page">
        <div id="measure-app"></div>
      </div>
    </div>
  </div>

  <div id="page-dots">
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
  </div>

  <div id="confirm-modal">
    <div class="c-sheet">
      <div class="c-handle"></div>
      <p class="c-msg" id="confirm-msg"></p>
      <button class="c-ok" id="confirm-ok">确认</button>
      <button class="c-cancel" id="confirm-cancel">取消</button>
    </div>
  </div>

  <div id="measure-modal">
    <div class="c-sheet">
      <div class="c-handle"></div>
      <p class="c-sheet-title">📝 记录今日数据</p>
      <div id="measure-form"></div>
      <button class="c-ok" id="measure-save">保存</button>
      <button class="c-cancel" id="measure-cancel">取消</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
